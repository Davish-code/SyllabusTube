[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syllabustube"
version = "0.1.0"
description = "Turn your syllabus PDF into a verified, topic-mapped YouTube playlist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SyllabusTube Team" }
]
dependencies = [
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
syllabustube = "main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
